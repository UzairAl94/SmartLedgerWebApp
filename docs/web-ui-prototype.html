  }

  function confirmThen(title, message, onConfirm, confirmLabel = "Delete") {
    state.modal = { kind: "confirm", title, message, confirmLabel, onConfirm };
    renderModal();
  }

  function copyText(text, label) {
    const finish = () => toast(`${label} copied`, "ok");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
    } else {
      fallbackCopy(text, finish);
    }
  }
  function fallbackCopy(text, finish) {
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try {
      document.execCommand("copy");
      finish();
    } catch (error) {
      toast("Could not copy — select the text manually", "error");
    }
    area.remove();
  }

  document.addEventListener("click", async (event) => {
    if (event.target && event.target.id === "modal-backdrop") {
      closeModal();
      return;
    }
    const trigger = event.target.closest("[data-action]");
    if (!trigger) return;
    const action = trigger.dataset.action;
    const id = trigger.dataset.id;

    if (action === "nav") {
      state.page = trigger.dataset.page;
      if (state.page === "transactions") state.tx.offset = 0;
      refresh();
    } else if (action === "refresh") {
      refresh();
    } else if (action === "theme") {
      state.theme = state.theme === "dark" ? "light" : "dark";
      saveConnection();
      render();
    } else if (action === "open-connect") {
      state.gateOpen = true;
      render();
    } else if (action === "close-gate") {
      state.gateOpen = false;
      render();
    } else if (action === "connect-demo") {
      state.mode = "demo";
      state.baseUrl = "";
      state.token = "";
      state.gateOpen = false;
      saveConnection();
      toast("Demo ledger loaded", "ok");
      refresh();
    } else if (action === "connect") {
      const baseUrl = val("conn-base");
      const token = val("conn-token");
      if (!baseUrl || !token) return toast("Base URL and token are required", "error");
      const previous = { mode: state.mode, baseUrl: state.baseUrl, token: state.token };
      state.mode = "live";
      state.baseUrl = baseUrl;
      state.token = token;
      try {
        const health = await api("/api/health");
        state.gateOpen = false;
        saveConnection();
        toast(`Connected · ${health.counts.transactions} transactions`, "ok");
        await refresh();
      } catch (error) {
        state.mode = previous.mode;
        state.baseUrl = previous.baseUrl;
        state.token = previous.token;
        toast(`Connection failed: ${error.message}`, "error");
        render();
      }
    } else if (action === "new-tx") {
      openTxModal(null);
    } else if (action === "edit-tx") {
      const row = state.tx.rows.find(item => item.id === id) || (state.dashboard && state.dashboard.recent.find(item => item.id === id));
      openTxModal(row || null);
    } else if (action === "delete-tx") {
      confirmThen("Delete transaction?", "The account balance will be adjusted back.", async () => {
        try {
          await api(`/api/transactions/${id}`, { method: "DELETE" });
          toast("Transaction deleted", "ok");
          await refresh();
        } catch (error) {
          toast(error.message, "error");
        }
      });
    } else if (action === "save-tx") {
      await saveTransaction(id || null);
    } else if (action === "close-modal") {
      closeModal();
    } else if (action === "confirm-yes") {
      const callback = state.modal && state.modal.onConfirm;
      closeModal();
      if (callback) await callback();
    } else if (action === "new-account") {
      openModal("account", { account: null });
    } else if (action === "edit-account") {
      openModal("account", { account: accountById(id) || null });
    } else if (action === "save-account") {
      await saveAccount(id || null);
    } else if (action === "delete-account") {
      confirmThen("Delete account?", "Its transactions are removed too, and balances recalculate.", async () => {
        try {
          await api(`/api/accounts/${id}`, { method: "DELETE" });
          toast("Account deleted", "ok");
          await refresh();
        } catch (error) {
          toast(error.message, "error");
        }
      });
    } else if (action === "view-account-tx") {
      state.page = "transactions";
      state.filters.accountId = id;
      state.tx.offset = 0;
      refresh();
    } else if (action === "new-budget") {
      openModal("budget", { budget: null });
    } else if (action === "edit-budget") {
      openModal("budget", { budget: state.budgets.find(item => item.id === id) || null });
    } else if (action === "save-budget") {
      await saveBudget(id || null);
    } else if (action === "delete-budget") {
      confirmThen("Delete budget?", "Spending history is not affected.", async () => {
        try {
          await api(`/api/budgets/${id}`, { method: "DELETE" });
          toast("Budget deleted", "ok");
          await refresh();
        } catch (error) {
          toast(error.message, "error");
        }
      });
    } else if (action === "new-recurring") {
      openModal("recurring", { rule: null });
    } else if (action === "save-recurring") {
      await saveRecurring();
    } else if (action === "toggle-recurring") {
      const active = trigger.dataset.active === "1";
      try {
        await api(`/api/recurring/${id}`, { method: "PATCH", body: { active: !active } });
        await refresh();
      } catch (error) {
        toast(error.message, "error");
      }
    } else if (action === "delete-recurring") {
      confirmThen("Delete recurring rule?", "Future transactions will not be created.", async () => {
        try {
          await api(`/api/recurring/${id}`, { method: "DELETE" });
          toast("Rule deleted", "ok");
          await refresh();
        } catch (error) {
          toast(error.message, "error");
        }
      });
    } else if (action === "undo-import") {
      confirmThen("Undo this import?", "Every transaction in the batch is deleted and balances are recalculated.", async () => {
        try {
          await api(`/api/imports/${encodeURIComponent(id)}`, { method: "DELETE" });
          toast("Import undone", "ok");
          await refresh();
        } catch (error) {
          toast(error.message, "error");
        }
      }, "Undo import");
    } else if (action === "tx-prev") {
      state.tx.offset = Math.max(0, state.tx.offset - state.tx.limit);
      await loadTransactions();
      render();
    } else if (action === "tx-next") {
      state.tx.offset += state.tx.limit;
      await loadTransactions();
      render();
    } else if (action === "clear-filters") {
      state.filters = { q: "", type: "", accountId: "", categoryId: "", from: "", to: "", order: "desc" };
      state.tx.offset = 0;
      await loadTransactions();
      render();
    } else if (action === "save-settings") {
      await saveSettings();
    } else if (action === "reveal-token") {
      if (state.mode === "live") copyText(state.token, "Access token");
      else toast("No token in demo mode");
    } else if (action === "copy-conn") {
      if (state.mode === "live") copyText(JSON.stringify({ baseUrl: state.baseUrl, token: state.token }, null, 2), "Connection JSON");
      else toast("Demo mode has no connection details");
    } else if (action === "copy-curl") {
      const base = state.mode === "live" ? state.baseUrl : "http://<phone-ip>:8765";
      const token = state.mode === "live" ? state.token : "<token>";
      copyText(`curl -s ${base}/api/health -H "Authorization: Bearer ${token}"`, "curl command");
    } else if (action === "export") {
      try {
        if (state.mode === "demo") {
          const data = await api("/api/export");
          copyText(JSON.stringify(data, null, 2), "Export JSON");
        } else {
          const response = await fetch(`${state.baseUrl.replace(/\/+$/, "")}/api/export`, { headers: { Authorization: `Bearer ${state.token}` } });
          const data = await response.json();
          copyText(JSON.stringify(data, null, 2), "Export JSON");
        }
      } catch (error) {
        toast(error.message, "error");
      }
    }
  });

  document.addEventListener("change", async (event) => {
    const trigger = event.target.closest("[data-change]");
    if (!trigger) return;
    const kind = trigger.dataset.change;
    if (kind === "range") {
      state.range = trigger.value;
      await loadDashboard();
      render();
    } else if (kind === "tx-type" || kind === "rec-type") {
      if (kind === "tx-type") syncTxForm();
      if (kind === "rec-type") {
        const type = trigger.value;
        const categoryField = $("rec-category-field");
        const toField = $("rec-to-field");
        const categorySelect = $("rec-category");
        if (categoryField) categoryField.style.display = type === "Transfer" ? "none" : "";
        if (toField) toField.style.display = type === "Transfer" ? "" : "none";
        if (categorySelect) {
          const selected = categorySelect.value;
          categorySelect.innerHTML = state.categories
            .filter(category => category.type === type)
            .map(category => `<option value="${category.id}">${esc(category.name)}</option>`)
            .join("");
          if (selected && categorySelect.querySelector(`option[value="${selected}"]`)) categorySelect.value = selected;
        }
      }
    } else if (kind === "tx-account") {
      syncTxForm();
    }
  });

  let searchTimer = null;
  document.addEventListener("input", (event) => {
    const trigger = event.target.closest("[data-filter]");
    if (!trigger) return;
    const key = trigger.dataset.filter;
    state.filters[key] = trigger.value;
    state.tx.offset = 0;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      await loadTransactions();
      render();
    }, 280);
  });

  document.addEventListener("input", (event) => {
    if (!event.target.matches("[data-search]")) return;
    state.filters.q = event.target.value;
    state.tx.offset = 0;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      await loadTransactions();
      render();
      const field = document.querySelector("[data-search]");
      if (field) {
        field.focus();
        field.setSelectionRange(field.value.length, field.value.length);
      }
    }, 280);
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      if (state.modal) closeModal();
      else if (state.gateOpen) state.gateOpen = false, render();
    }
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      const field = document.querySelector("[data-search]");
      if (field) {
        event.preventDefault();
        field.focus();
      }
    }
  });

  function applyHash() {
    const raw = location.hash.replace(/^#/, "");
    if (!raw) return;
    const params = new URLSearchParams(raw);
    const page = params.get("page");
    if (page && PAGE_META[page]) state.page = page;
    const theme = params.get("theme");
    if (theme === "dark" || theme === "light") state.theme = theme;
    const range = params.get("range");
    if (range && RANGE_OPTIONS.some(([value]) => value === range)) state.range = range;
  }

  async function boot() {
    const saved = loadConnection();
    applyHash();
    document.documentElement.dataset.theme = state.theme;
    if (!saved) state.mode = "demo";
    render();
    await refresh();
    if (state.mode === "live" && state.error) {
      state.gateOpen = true;
      render();
    }
  }

  boot();
})();
</script>
</body>
</html>
